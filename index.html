
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8c8dc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cherrycraft</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="app">

        <header>
            <h1>🌸 Cherrycraft</h1>
            <p>A little world for big goals.</p>
        </header>

        <section class="garden">
            <div id="pixel-scene"></div>
            <p id="garden-message">Your garden is waiting...</p>
        </section>

        <section class="timer-card">

            <p id="session-status">Time to focus ♡</p>

            <h2 id="timer">60:00</h2>

            <div class="time-options">
                <button data-minutes="25">25 min</button>
                <button data-minutes="45">45 min</button>
                <button data-minutes="60">60 min</button>
                <button id="custom-time">Custom</button>
            </div>

            <input id="study-subject"
                type="text"
                placeholder="What are we studying?">

            <button id="start-button">
                Start study session
            </button>

            <button id="pause-button" hidden>
                Pause
            </button>

            <button id="end-button" hidden>
                End session
            </button>

        </section>

        <section class="reply-card">

            <h3>💌 Automatic replies</h3>

            <label>
                <input type="checkbox" id="auto-reply">
                Enable auto-reply
            </label>

            <textarea id="reply-message">Hey! I'm currently in a study session and will get back to you as soon as possible. Thank you! ♡</textarea>

            <p id="reply-status">
                iPhone integration not connected
            </p>

        </section>

        <section class="rewards-card">
            <h3>✧ Your inventory ✧</h3>
            
<div class="inventory">
    <div class="item">
        <img src="assets/flower.png" alt="Cherry blossom">
        <span>Blossoms</span>
        <span id="flowers">0</span>
    </div>

    <div class="item">
        <img src="assets/book.png" alt="Enchanted book">
        <span>Books</span>
        <span id="books">0</span>
    </div>

    <div class="item">
        <img src="assets/apple.png" alt="Golden apple">
        <span>Apples</span>
        <span id="apples">0</span>
    </div>
</div>

        </section>

        <section class="stats-card">
            <h3>Your progress</h3>
            <p>Minutes studied: <span id="total-minutes">0</span></p>
            <p>Sessions completed: <span id="total-sessions">0</span></p>
        </section>

        <footer>
            Made for peaceful productivity ♡
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
